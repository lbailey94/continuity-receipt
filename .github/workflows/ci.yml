name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install 'cryptography>=42' jsonschema
      - name: Conformance suite (vectors + schema + primitives)
        run: python3 -m unittest discover -s tests -v
      - name: Independent-agent pilot regressions
        run: python3 -m unittest discover -s examples/independent-agent-pilot -p 'test_*.py' -v
      - name: Crystal client boundary regressions
        run: python3 -m unittest discover -s ops/crystal-ownership-candidate/tests -p 'test_*.py' -v
      - name: Synthetic customer-recovery regressions
        run: python3 -m unittest discover -s ops/crystal-customer-recovery -v
      - name: Verify each vector via the CLI surface
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          manifest = json.loads(Path("vectors/manifest.json").read_text())
          for entry in manifest["vectors"]:
              cmd = [sys.executable, "-m", "continuity_receipt.verify", f"vectors/{entry['file']}"]
              if entry["require_anchor"]:
                  cmd.append("--require-anchor")
              proc = subprocess.run(cmd, capture_output=True, text=True)
              expected_rc = 0 if entry["expected_verdict"] == "TRUSTED" else 1
              if proc.returncode != expected_rc:
                  raise SystemExit(f"{entry['file']}: rc {proc.returncode} != {expected_rc}")
          print(f"CLI verified {len(manifest['vectors'])} vectors")
          vmanifest = json.loads(Path("vectors/verification/manifest.json").read_text())
          for entry in vmanifest["vectors"]:
              cmd = [sys.executable, "-m", "continuity_receipt.verification",
                     f"vectors/verification/{entry['file']}"]
              if entry.get("bundle_file"):
                  cmd += ["--bundle", f"vectors/verification/{entry['bundle_file']}"]
              if entry.get("revocations_file"):
                  cmd += ["--revocations", f"vectors/verification/{entry['revocations_file']}"]
              proc = subprocess.run(cmd, capture_output=True, text=True)
              expected_rc = 0 if entry["expected_valid"] else 1
              if proc.returncode != expected_rc:
                  raise SystemExit(f"{entry['file']}: rc {proc.returncode} != {expected_rc}")
          print(f"CLI verified {len(vmanifest['vectors'])} verification receipts")
          PY

      - name: Conformance submission tool (self-check)
        run: |
          python3 tools/conformance_submit.py --python --version ci --out /tmp/submission.json
          python3 -c "import json; s = json.load(open('/tmp/submission.json')); assert len(s['results']['bundles']) == 40 and len(s['results']['verification_receipts']) == 21, s"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python3 -m build
      - name: Install the wheel and exercise the console scripts
        run: |
          python3 -m venv /tmp/cr-venv
          . /tmp/cr-venv/bin/activate
          pip install dist/*.whl
          cd /tmp
          continuity-receipt-verify "$GITHUB_WORKSPACE/vectors/02_happy_full.json" > /tmp/trusted.json
          python3 -c "import json; assert json.load(open('/tmp/trusted.json'))['verdict'] == 'TRUSTED'"
          if continuity-receipt-verify "$GITHUB_WORKSPACE/vectors/10b_anchor_missing.json" --require-anchor; then
            echo "expected nonzero exit for anchor-missing with --require-anchor" >&2
            exit 1
          fi
          continuity-receipt-disclose --help > /dev/null
          continuity-receipt-verify --help > /dev/null
          continuity-receipt-anchor --help > /dev/null
          continuity-verify --help > /dev/null
          continuity-receipt-disclose verify \
            --bundle "$GITHUB_WORKSPACE/vectors/08_redacted_disclosed.json" > /tmp/disclosed.json
          python3 -c "import json; assert json.load(open('/tmp/disclosed.json'))['verdict'] == 'TRUSTED'"
          if continuity-receipt-anchor verify \
            "$GITHUB_WORKSPACE/vectors/anchor/hello-world.txt.ots" \
            --digest sha256:03ba204e50d126e4674c005e04d82e84c21366780af1f43bd54a37816b6ab340 \
            --json > /tmp/anchor.json; then
            echo "expected unverified without the Bitcoin header" >&2
            exit 1
          fi
          python3 -c "import json; assert json.load(open('/tmp/anchor.json'))['code'] == 'anchor_unverified'"
          continuity-receipt-verify-receipt "$GITHUB_WORKSPACE/vectors/verification/01_valid.json" \
            --bundle "$GITHUB_WORKSPACE/vectors/verification/bundle.json" > /tmp/vreceipt.json
          python3 -c "import json; assert json.load(open('/tmp/vreceipt.json'))['valid'] is True"
          continuity-consumer "$GITHUB_WORKSPACE/examples/independent-agent-pilot/bundle.json" \
            --policy "$GITHUB_WORKSPACE/examples/independent-agent-pilot/policy.json" > /tmp/consumer.json
          python3 -c "import json; assert json.load(open('/tmp/consumer.json'))['outcome'] == 'ACCEPT'"
          /tmp/cr-venv/bin/python "$GITHUB_WORKSPACE/examples/independent-agent-pilot/run_pilot.py" \
            --installed-package > /tmp/pilot.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('/tmp/pilot.json').read_text())
          assert report['status'] == 'LOCAL_DRY_RUN_ONLY'
          assert len(report['cases']) == 8
          source = Path(report['source_pins_observed_locally']['imported_consumer_path']).resolve()
          assert source.is_relative_to(Path('/tmp/cr-venv').resolve()), source
          assert not source.is_relative_to(Path(os.environ['GITHUB_WORKSPACE']).resolve()), source
          print(f"bounded installed-package pilot cases: {len(report['cases'])}")
          PY

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install verifier dependency
        run: pip install 'cryptography>=42'
      - name: Rust conformance suite
        run: cargo test --manifest-path rust/Cargo.toml
      - name: Differential check (Python vs Rust over all vectors)
        run: |
          cargo build --manifest-path rust/Cargo.toml
          python3 tools/differential_vectors.py
          python3 tools/differential_vectors.py --manifest vectors/manifest-0.5.json
      - name: Local 0.5 producer integration probe
        run: python3 tools/local_integration_probe.py
      - name: Differential check (Python vs Rust selective disclosure)
        run: python3 tools/differential_disclose.py
      - name: Differential check (Python vs Rust OpenTimestamps anchors)
        run: python3 tools/differential_anchor.py
      - name: Differential check (Python vs Rust verification receipts)
        run: python3 tools/differential_verification_receipts.py
      - name: Hostile-input probe (both implementations, structured outcomes + parity)
        run: |
          python3 tools/hostile_input_probe.py --sample 300 --require-parity
          python3 tools/hostile_input_probe.py --vector-manifest vectors/manifest-0.5.json --sample 100 --require-parity
