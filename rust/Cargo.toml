[package]
name = "continuity-receipt"
version = "0.3.0-alpha.1"
edition = "2021"
license = "Apache-2.0"
description = "Independent Rust verifier for continuity-receipt/0.1-0.2 bundles (the Python implementation remains the reference)"
repository = "https://github.com/lbailey94/continuity-receipt"
readme = "README.md"

[workspace]

[[bin]]
name = "continuity-receipt-verify"
path = "src/bin/continuity-receipt-verify.rs"

[dependencies]
serde_json = { version = "1", features = ["arbitrary_precision"] }
ed25519-dalek = "2"
sha2 = "0.10"
bs58 = "0.5"
base64 = "0.22"
